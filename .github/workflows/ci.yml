name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      # The runner image already has the Android SDK ($ANDROID_HOME). Accepting its licences lets AGP
      # download the exact platform and build-tools it needs (compileSdk 36.1).
      - name: Accept Android SDK licences
        run: |
          SDKMANAGER=$(ls "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | head -1)
          yes | "$SDKMANAGER" --licenses > /dev/null || true

      - uses: gradle/actions/setup-gradle@v4

      # Lint, unit tests (Robolectric, Compose UI) and both APKs. The release APK is unsigned here:
      # signing only happens when KEYSTORE_PATH, STORE_PASSWORD and KEY_PASSWORD are set.
      - name: Build and test
        run: ./gradlew build
        env:
          VERSION_CODE: ${{ github.run_number }}

      - name: Upload reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            app/build/reports/
            app/build/test-results/
          if-no-files-found: ignore
