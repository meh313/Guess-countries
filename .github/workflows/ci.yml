name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          distribution: temurin
          java-version: 21

      # The runner image already has the Android SDK ($ANDROID_HOME). Accepting its licences lets AGP
      # download the exact platform and build-tools it needs (compileSdk 37).
      - name: Accept Android SDK licences
        run: |
          SDKMANAGER=$(ls "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | head -1)
          yes | "$SDKMANAGER" --licenses > /dev/null || true

      # The look-alike check decodes the flag WebPs with Pillow, and the distances follow the decoder, so the exact
      # Pillow build that wrote FlagLookAlikes.kt is pinned in tools/requirements.txt.
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: tools/requirements.txt
      - run: pip install -r tools/requirements.txt

      # The generated assets must match their sources, or the app ships stale data: the per-country source pages
      # (export-sources.py), the third-party notices the About screen shows (export-notices.py) and the look-alike
      # flags (gen-lookalikes.py, from the flag images). The world map comes from a download, so its check only
      # verifies the committed asset (format, every catalog code, Geo.kt, Neighbours.kt).
      - name: Check the generated assets
        run: |
          python3 tools/export-sources.py --check
          python3 tools/export-notices.py --check
          python3 tools/gen-worldmap.py --check
          python3 tools/gen-lookalikes.py --check
          python3 tools/gen-sounds.py --check
          python3 tools/strings-audit.py --check

      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6

      # Lint, the unit tests (Robolectric, Compose UI) and both APKs. Named tasks rather than `build`, which
      # would run the same unit tests a second time for the release variant (they are not minified, so that
      # second run adds nothing). The release APK is unsigned here: signing only happens when KEYSTORE_PATH,
      # STORE_PASSWORD and KEY_PASSWORD are set.
      - name: Build and test
        run: ./gradlew lintDebug testDebugUnitTest assembleDebug assembleRelease
        env:
          VERSION_CODE: ${{ github.run_number }}

      - name: Upload reports
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: reports
          path: |
            app/build/reports/
            app/build/test-results/
          if-no-files-found: ignore

      # Pictures of every screen, taken by ScreenshotsTest, so a change can be looked at from the run page.
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: screenshots
          path: app/build/screenshots/
          if-no-files-found: ignore
