name: Release

# Builds the release APK and the app bundle (.aab) from the checked-out commit, signs both with the upload
# key kept in the repository secrets, verifies them and publishes them as a GitHub Release. The .apk is for
# sideloading; the .aab is what the Play Console takes.
#
# Two jobs, so the signed files are made with a read-only token and only the last step holds a write one:
#   build    permissions: contents: read. Lints, tests, builds, signs and verifies the APK and the bundle and
#            keeps them, their checksums, the R8 mapping and the release notes as the workflow artifact
#            "release-files".
#   publish  permissions: contents: write, in the GitHub environment "release". Downloads that artifact and
#            creates the tag and the release. Skipped on a dry run. To have every publish wait for a person,
#            add required reviewers to the "release" environment (Settings > Environments > release); the
#            environment is created on the first run if it does not exist yet.
#
# Two ways to run it:
#   - Actions > Release > Run workflow, on main (the usual way). The version is versionName in
#     app/build.gradle.kts; the tag v<version> is created at that commit and the release published.
#     Tick "dry run" to only build, sign and verify: the files are kept as a workflow artifact for a
#     week and nothing is published. Use that once after adding the secrets.
#   - Push a tag v<version>; it must match versionName, and the tagged commit must be on main.
#
# Secrets (Settings > Secrets and variables > Actions > Repository secrets):
#   KEYSTORE_BASE64  the upload keystore (world-flags-upload.jks) encoded with base64
#   STORE_PASSWORD   its store password
#   KEY_PASSWORD     the password of the "upload" key inside it
#
# versionCode is derived from the version as major*10000 + minor*100 + patch (1.6 -> 10600,
# 1.6.1 -> 10601), so it always grows with the version and stays above the hand-numbered codes
# 1 to 7 of releases 1.0 to 1.5. app/build.gradle.kts derives it; this workflow works it out
# again for the file names and checks that the APK carries it.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      dry_run:
        description: Build, sign and verify only; publish nothing
        type: boolean
        default: false

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

env:
  # SHA-256 of the upload certificate. A keystore that does not produce it fails the run.
  EXPECTED_CERT: 151c68bfdc8dba3cfdba818ff827309344382e268dc45cd5bc3ac88460189d7a
  DRY_RUN: ${{ inputs.dry_run == true }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      code: ${{ steps.version.outputs.code }}
      apk: ${{ steps.files.outputs.apk }}
      aab: ${{ steps.files.outputs.aab }}
    steps:
      # A release is main as CI tested it, or a version tag. Nothing else gets signed and published.
      - name: Refuse any ref but main or a version tag
        run: |
          if [ "$GITHUB_REF" != refs/heads/main ] && [ "$GITHUB_REF_TYPE" != tag ]; then
            echo "::error::Releases are built from main or a v* tag, not from $GITHUB_REF_NAME."
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # A tag can be put on any commit; only one that main has been through (reviewed, tested by CI) is released.
      - name: Check that a tagged commit is on main
        if: github.ref_type == 'tag'
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::Tag $GITHUB_REF_NAME points at $GITHUB_SHA, which is not on main. Merge it first."
            exit 1
          fi

      - name: Check the signing secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          missing=""
          [ -n "$KEYSTORE_BASE64" ] || missing="$missing KEYSTORE_BASE64"
          [ -n "$STORE_PASSWORD" ] || missing="$missing STORE_PASSWORD"
          [ -n "$KEY_PASSWORD" ] || missing="$missing KEY_PASSWORD"
          if [ -n "$missing" ]; then
            echo "::error::Missing repository secret(s):$missing. Add them under Settings > Secrets and variables > Actions."
            exit 1
          fi
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload.jks"
          echo "KEYSTORE_PATH=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"

      # Reading the existing releases needs no write access: the token here can only read the repository.
      - name: Work out the version
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version=$(sed -n 's/^ *versionName = "\([0-9][0-9.]*\)".*/\1/p' app/build.gradle.kts | head -1)
          [ -n "$version" ] || { echo "::error::versionName not found in app/build.gradle.kts"; exit 1; }
          tag="v$version"
          if [ "$GITHUB_REF_TYPE" = tag ] && [ "$GITHUB_REF_NAME" != "$tag" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match versionName $version in app/build.gradle.kts"
            exit 1
          fi
          IFS=. read -r major minor patch <<< "$version"
          code=$(( major * 10000 + minor * 100 + ${patch:-0} ))
          if [ "$DRY_RUN" != true ]; then
            if gh release view "$tag" > /dev/null 2>&1; then
              echo "::error::Release $tag already exists. Bump versionName in app/build.gradle.kts first."
              exit 1
            fi
            newest=$( { gh release list --json tagName --jq '.[].tagName'; echo "$tag"; } | sed 's/^v//' | sort -V | tail -1 )
            if [ "$newest" != "$version" ]; then
              echo "::error::Version $version is lower than the latest release v$newest."
              exit 1
            fi
          fi
          {
            echo "version=$version"
            echo "tag=$tag"
            echo "code=$code"
          } >> "$GITHUB_OUTPUT"
          echo "Building World Flags $version as $tag, versionCode $code (dry run: $DRY_RUN)"

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6
        with:
          distribution: temurin
          java-version: 21

      - name: Accept Android SDK licences
        run: |
          SDKMANAGER=$(ls "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | head -1)
          yes | "$SDKMANAGER" --licenses > /dev/null || true

      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6

      # Lint and the unit tests run again here: a release must not depend on remembering to look at CI first.
      - name: Lint, test and build the signed release APK and app bundle
        env:
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew --console=plain lintDebug testDebugUnitTest assembleRelease bundleRelease

      - name: Upload reports
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: release-reports
          path: |
            app/build/reports/
            app/build/test-results/
          if-no-files-found: ignore

      - name: Verify the APK and the bundle and collect the files
        id: files
        env:
          VERSION: ${{ steps.version.outputs.version }}
          CODE: ${{ steps.version.outputs.code }}
        run: |
          set -euo pipefail
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          src=app/build/outputs/apk/release/app-release.apk
          cert=$("$BT/apksigner" verify --print-certs "$src" | sed -n 's/.*SHA-256 digest: //p' | head -1)
          if [ "$cert" != "$EXPECTED_CERT" ]; then
            echo "::error::The APK is signed with an unexpected certificate ($cert). Check KEYSTORE_BASE64."
            exit 1
          fi
          "$BT/zipalign" -c 4 "$src"
          badging=$("$BT/aapt2" dump badging "$src" | grep -oE "versionCode='[0-9]+' versionName='[^']+'")
          if [ "$badging" != "versionCode='$CODE' versionName='$VERSION'" ]; then
            echo "::error::Unexpected version in the APK: $badging"
            exit 1
          fi
          # The bundle is a jar signed with the same key (Gradle signs it with the release signingConfig). jarsigner
          # checks the signature; keytool reads the signer's certificate out of it and prints its SHA-256 fingerprint
          # as colon-separated hex, which is compared with EXPECTED_CERT. bundletool is not on the runner, so the
          # bundle's version is not re-read; it comes from the same Gradle invocation as the APK checked above.
          bundle=app/build/outputs/bundle/release/app-release.aab
          [ -s "$bundle" ] || { echo "::error::bundleRelease produced no $bundle"; exit 1; }
          jarsigner -verify -verbose -certs "$bundle" > "$RUNNER_TEMP/aab-verify.txt"
          if ! grep -q '^jar verified' "$RUNNER_TEMP/aab-verify.txt"; then
            tail -20 "$RUNNER_TEMP/aab-verify.txt"
            echo "::error::The app bundle's signature does not verify. Is the release signing config applied?"
            exit 1
          fi
          aabcert=$(keytool -printcert -jarfile "$bundle" | sed -n 's/^[[:space:]]*SHA256: //p' | head -1 | tr -d : | tr 'A-F' 'a-f')
          if [ "$aabcert" != "$EXPECTED_CERT" ]; then
            echo "::error::The app bundle is signed with an unexpected certificate ($aabcert). Check KEYSTORE_BASE64."
            exit 1
          fi
          apk="world-flags-$VERSION-code$CODE-release.apk"
          aab="world-flags-$VERSION-code$CODE-release.aab"
          mkdir -p dist
          cp "$src" "dist/$apk"
          cp "$bundle" "dist/$aab"
          (cd dist && sha256sum "$apk" > "$apk.sha256" && sha256sum "$aab" > "$aab.sha256")
          gzip -9 -c app/build/outputs/mapping/release/mapping.txt > "dist/mapping-$VERSION.txt.gz"
          sha=$(cut -c1-64 "dist/$apk.sha256")
          aabsha=$(cut -c1-64 "dist/$aab.sha256")
          commit=$(git rev-parse --short HEAD)
          {
            echo "apk=$apk"
            echo "aab=$aab"
            echo "sha=$sha"
            echo "aabsha=$aabsha"
          } >> "$GITHUB_OUTPUT"
          cat > dist/notes.md <<EOF
          **World Flags $VERSION** (versionCode $CODE), built by GitHub Actions from \`$commit\`.

          **Install:** Android 7.0 or newer. Installs over any earlier release from this page (same signing key); your progress is kept.

          The \`.apk\` is for sideloading; the \`.aab\` is the app bundle for the Play Console.

          **Verify**

          | File | SHA-256 |
          |---|---|
          | \`$apk\` | \`$sha\` |
          | \`$aab\` | \`$aabsha\` |

          Signing certificate SHA-256 (the same for every release, APK and bundle alike): \`$EXPECTED_CERT\`

          \`mapping-$VERSION.txt.gz\` is the R8 mapping file for reading obfuscated crash traces.
          EOF
          # What this version changes for the player, when the release has something to say beyond the commit list.
          if [ -f "release-notes/$VERSION.md" ]; then
            { echo; cat "release-notes/$VERSION.md"; } >> dist/notes.md
          fi
          ls -l dist

      # The files the publish job releases; on a dry run they are what the run leaves behind, for a week.
      - name: Keep the files as a workflow artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: release-files
          path: dist/
          retention-days: 7
          if-no-files-found: error

  publish:
    needs: build
    if: inputs.dry_run != true
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    environment: release
    steps:
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: release-files
          path: dist

      - name: Check the files are the ones the build verified
        env:
          APK: ${{ needs.build.outputs.apk }}
          AAB: ${{ needs.build.outputs.aab }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          set -euo pipefail
          ls -l dist
          (cd dist && sha256sum -c "$APK.sha256" "$AAB.sha256")
          [ -s "dist/mapping-$VERSION.txt.gz" ] && [ -s dist/notes.md ]

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.build.outputs.tag }}
          VERSION: ${{ needs.build.outputs.version }}
          APK: ${{ needs.build.outputs.apk }}
          AAB: ${{ needs.build.outputs.aab }}
        run: |
          set -euo pipefail
          gh release create "$TAG" --target "$GITHUB_SHA" --title "World Flags $VERSION" \
            --notes-file dist/notes.md --generate-notes --latest \
            "dist/$APK" "dist/$APK.sha256" "dist/$AAB" "dist/$AAB.sha256" "dist/mapping-$VERSION.txt.gz"
          echo "Published https://github.com/$GITHUB_REPOSITORY/releases/tag/$TAG"
